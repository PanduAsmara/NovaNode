<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NovaNode — Professional Infrastructure Management for Pterodactyl Ecosystems">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 110) scale(420)">
      <stop stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 330) scale(460)">
      <stop stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGrad" x1="86" y1="116" x2="214" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="560" y1="120" x2="780" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="22" fill="url(#dots)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="22" fill="url(#glowB)"/>

  <!-- mark: center (150,180) R=64 -->
  <g filter="url(#soft)">
    <polygon points="150,116 205.4,148 205.4,212 150,244 94.6,212 94.6,148"
             fill="none" stroke="url(#gGrad)" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="url(#gGrad)" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9">
      <line x1="150" y1="180" x2="150" y2="116"/>
      <line x1="150" y1="180" x2="205.4" y2="148"/>
      <line x1="150" y1="180" x2="205.4" y2="212"/>
      <line x1="150" y1="180" x2="150" y2="244"/>
      <line x1="150" y1="180" x2="94.6" y2="212"/>
      <line x1="150" y1="180" x2="94.6" y2="148"/>
    </g>
    <g fill="url(#gGrad)">
      <circle cx="150" cy="116" r="7"/>
      <circle cx="205.4" cy="148" r="7"/>
      <circle cx="205.4" cy="212" r="7"/>
      <circle cx="150" cy="244" r="7"/>
      <circle cx="94.6" cy="212" r="7"/>
      <circle cx="94.6" cy="148" r="7"/>
    </g>
    <circle cx="150" cy="180" r="15" fill="#0B1020" stroke="url(#gGrad)" stroke-width="3"/>
    <path d="M150 168 C151.6 177 153 178.4 162 180 C153 181.6 151.6 183 150 192 C148.4 183 147 181.6 138 180 C147 178.4 148.4 177 150 168 Z" fill="url(#gGrad)"/>
  </g>

  <!-- wordmark -->
  <text x="300" y="172" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#FFFFFF">Nova</tspan><tspan fill="url(#wordGrad)">Node</tspan>
  </text>

  <text x="303" y="214" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#94A3B8">Professional Infrastructure Management for Pterodactyl Ecosystems</text>

  <!-- feature pills -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    <rect x="303" y="238" width="104" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="355" y="257" fill="#C7D2FE">Open Source</text>
    <rect x="415" y="238" width="100" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="465" y="257" fill="#C7D2FE">Self-Hosted</text>
    <rect x="523" y="238" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="569" y="257" fill="#C7D2FE">Automated</text>
    <rect x="623" y="238" width="78" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="662" y="257" fill="#C7D2FE">Secure</text>
  </g>

  <text x="304" y="322" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B">Created by PanduAsmara</text>
</svg>
