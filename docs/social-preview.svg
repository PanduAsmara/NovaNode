<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NovaNode — Professional Infrastructure Management for Pterodactyl Ecosystems">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 120) scale(560)">
      <stop stop-color="#6366F1" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 560) scale(620)">
      <stop stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gGrad" x1="550" y1="115" x2="730" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="700" y1="320" x2="860" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- mark: center (640,205) R=90 -->
  <polygon points="640,115 717.9,160 717.9,250 640,295 562.1,250 562.1,160"
           fill="none" stroke="url(#gGrad)" stroke-opacity="0.45" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="url(#gGrad)" stroke-width="9" stroke-linecap="round" stroke-opacity="0.92">
    <line x1="640" y1="205" x2="640" y2="115"/>
    <line x1="640" y1="205" x2="717.9" y2="160"/>
    <line x1="640" y1="205" x2="717.9" y2="250"/>
    <line x1="640" y1="205" x2="640" y2="295"/>
    <line x1="640" y1="205" x2="562.1" y2="250"/>
    <line x1="640" y1="205" x2="562.1" y2="160"/>
  </g>
  <g fill="url(#gGrad)">
    <circle cx="640" cy="115" r="10"/>
    <circle cx="717.9" cy="160" r="10"/>
    <circle cx="717.9" cy="250" r="10"/>
    <circle cx="640" cy="295" r="10"/>
    <circle cx="562.1" cy="250" r="10"/>
    <circle cx="562.1" cy="160" r="10"/>
  </g>
  <circle cx="640" cy="205" r="22" fill="#0B1020" stroke="url(#gGrad)" stroke-width="4"/>
  <path d="M640 187 C642.4 200 644.6 202.4 658 205 C644.6 207.6 642.4 210 640 223 C637.6 210 635.4 207.6 622 205 C635.4 202.4 637.6 200 640 187 Z" fill="url(#gGrad)"/>

  <!-- wordmark -->
  <text x="640" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2">
    <tspan fill="#FFFFFF">Nova</tspan><tspan fill="url(#wordGrad)">Node</tspan>
  </text>

  <text x="640" y="452" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#94A3B8">Professional Infrastructure Management for Pterodactyl Ecosystems</text>

  <!-- feature pills (centered group) -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="430" y="492" width="126" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="493" y="515" fill="#C7D2FE">Open Source</text>
    <rect x="566" y="492" width="120" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="626" y="515" fill="#C7D2FE">Self-Hosted</text>
    <rect x="696" y="492" width="114" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="753" y="515" fill="#C7D2FE">Automated</text>
    <rect x="820" y="492" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="866" y="515" fill="#C7D2FE">Secure</text>
  </g>

  <text x="640" y="588" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#64748B">Created by PanduAsmara</text>
</svg>
